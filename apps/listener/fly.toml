# Fly.io config for slippay-listener (testnet/staging)
# Deploy: cd apps/listener && flyctl deploy
# Secrets: flyctl secrets set SUPABASE_SERVICE_ROLE_KEY=... SUPABASE_URL=...

app = "slippay-listener-staging"
primary_region = "gru"           # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  STALLAR_NETWORK = "TESTNET"
  MERCHANT_POLL_MS = "30000"
  NODE_ENV = "production"
  PORT = "8080"

[processes]
  app = "node dist/main.js"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

# Health/metrics HTTP surface. Fly polls /health and restarts the machine
# when it reports unhealthy (e.g. a lost lease).
[[services]]
  internal_port = 8080
  protocol = "tcp"
  [[services.concurrency]]
    type = "connections"
    soft_limit = 25
    hard_limit = 50
  [[services.http_checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "5s"
    path = "/health"
    method = "get"
    protocol = "http"
  [[services.http_checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "5s"
    path = "/v1/metrics"
    method = "get"
    protocol = "http"

# Keep one machine running 24/7 — auto_stop disabled.
[[restart]]
  policy = "always"
  max_restarts = 10
