# Fly.io config for slippay-listener (testnet/staging)
# Deploy: cd apps/listener && flyctl deploy
# Secrets: flyctl secrets set SUPABASE_SERVICE_ROLE_KEY=... SUPABASE_URL=...

app = "slippay-listener-staging"
primary_region = "gru"           # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  STELLAR_NETWORK = "TESTNET"
  MERCHANT_POLL_MS = "30000"
  PORT = "8080"
  NODE_ENV = "production"

[processes]
  app = "node dist/main.js"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[restart]]
  policy = "always"
  max_restarts = 10
